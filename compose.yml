services:
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development  # Specify the build stage
      args:
        - NODE_ENV=development
        # Args for production
        - NEXT_PUBLIC_REST_URL=http://backend:8000
        - NEXT_PUBLIC_ACCESS_TOKEN_KEY=${NEXT_PUBLIC_ACCESS_TOKEN_KEY:-}
        - NEXT_PUBLIC_REFRESH_TOKEN_KEY=${NEXT_PUBLIC_REFRESH_TOKEN_KEY:-}
        - NEXT_PUBLIC_URL=${NEXT_PUBLIC_URL:-}
        - NEXT_PUBLIC_REST_URL=${NEXT_PUBLIC_REST_URL:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # - ./frontend/node_modules:/app/node_modules
    ports:
      - "3000:3000"
      # Port to debug production build
      - "3001:3001"

  backend:
    container_name: backendd
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/code
    env_file:
      - ./.env
    environment:
      - SERVICE=backend
    ports:
      - 8000:8000
    depends_on:
      - database

  database:
    container_name: db
    build:
      context: ./database
    volumes:
      - ./database/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./database/postgresql.conf:/etc/postgresql/postgresql.conf
    environment:
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  entrypoint.sh:
